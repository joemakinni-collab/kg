<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kamene Goro</title>
<link rel="icon" type="image/png" href="assets/images/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f5f5f0;color:#111}
.admin-wrap{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem;flex-wrap:wrap;gap:1rem}
.admin-header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;margin:0}
.admin-header h1 i{color:#ec4899}
.login-box{max-width:380px;margin:4rem auto;text-align:center}
.login-box .lock-icon{font-size:3rem;color:#ec4899;margin-bottom:1rem}
.login-box h2{font-weight:700;margin-bottom:.5rem}
.login-box p{color:#666;margin-bottom:1.5rem;font-size:.95rem}
.login-box input{width:100%;padding:.8rem 1rem;border:2px solid #ddd;border-radius:12px;font-size:1rem;outline:none;transition:.2s}
.login-box input:focus{border-color:#ec4899}
.login-box .error{color:#dc2626;font-size:.85rem;margin-top:.5rem;display:none}
.login-box button{width:100%;margin-top:1rem;padding:.8rem;border:none;border-radius:12px;background:#111;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;transition:.2s}
.login-box button:hover{background:#333}
.card-dash{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:1.5rem}
.card-dash h2{font-size:1.2rem;font-weight:700;margin-bottom:1.2rem;display:flex;align-items:center;gap:.5rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem;color:#374151}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:.65rem .9rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.9rem;outline:none;transition:.2s;font-family:inherit}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:#ec4899}
.form-grid textarea{resize:vertical;min-height:70px}
.sizes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.5rem;margin-top:.3rem}
.size-item{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.4rem;border:1.5px solid #e5e7eb;border-radius:8px;font-size:.8rem;font-weight:500}
.size-item input{width:100%;padding:.3rem;text-align:center;border:1px solid #e5e7eb;border-radius:6px;font-size:.8rem;outline:none}
.size-item input:focus{border-color:#ec4899}
.btn-primary{background:#111;color:#fff;border:none;padding:.65rem 1.5rem;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-primary:hover{background:#333}
.btn-danger{background:#fee2e2;color:#dc2626;border:none;padding:.4rem .7rem;border-radius:8px;cursor:pointer;font-size:.8rem;transition:.2s}
.btn-danger:hover{background:#fecaca}
.btn-edit{background:#e0e7ff;color:#4338ca;border:none;padding:.4rem .7rem;border-radius:8px;cursor:pointer;font-size:.8rem;transition:.2s}
.btn-edit:hover{background:#c7d2fe}
.prod-list{display:flex;flex-direction:column;gap:.6rem}
.prod-item{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem;border:1.5px solid #f0f0f0;border-radius:12px;transition:.2s}
.prod-item:hover{background:#fafafa}
.prod-item img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.prod-item .info{flex:1;min-width:0}
.prod-item .info strong{display:block;font-size:.9rem}
.prod-item .info span{font-size:.8rem;color:#666}
.prod-item .actions{display:flex;gap:.4rem}
.empty-state{text-align:center;padding:2rem;color:#999;font-size:.9rem}
.badge-dash{display:inline-block;background:#f0f0f0;padding:.15rem .6rem;border-radius:99px;font-size:.75rem;font-weight:600;color:#666}
.logout-btn{background:none;border:1.5px solid #ddd;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-size:.85rem;color:#666;transition:.2s}
.logout-btn:hover{background:#f0f0f0}
.hidden{display:none!important}
.toast-admin{position:fixed;bottom:2rem;right:2rem;background:#111;color:#fff;padding:.8rem 1.4rem;border-radius:12px;font-size:.9rem;font-weight:500;z-index:9999;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none}
.toast-admin.show{opacity:1;transform:translateY(0)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="admin-wrap" id="app">
  <div class="admin-header">
    <h1><i class="fas fa-store"></i> Store Admin</h1>
    <button class="logout-btn hidden" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- Login -->
  <div class="login-box" id="loginBox">
    <div class="lock-icon"><i class="fas fa-lock"></i></div>
    <h2>Admin Access</h2>
    <p>Enter the admin password to manage store products.</p>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
    <div class="error" id="loginError">Incorrect password</div>
    <button id="loginBtn">Unlock <i class="fas fa-arrow-right"></i></button>
  </div>

  <!-- Dashboard (hidden until login) -->
  <div id="dashboard" class="hidden">
    <!-- Add / Edit form -->
    <div class="card-dash">
      <h2><i class="fas fa-plus-circle" style="color:#ec4899"></i> <span id="formTitle">Add Product</span></h2>
      <form id="productForm" autocomplete="off">
        <div class="form-grid">
          <div>
            <label>Product Name</label>
            <input type="text" id="fName" required placeholder="e.g. Signature Hoodie">
          </div>
          <div>
            <label>Category</label>
            <select id="fCategory">
              <option>Apparel</option>
              <option>Accessories</option>
              <option>Lifestyle</option>
              <option>Stationery</option>
            </select>
          </div>
          <div>
            <label>Price (KES)</label>
            <input type="number" id="fPrice" required placeholder="e.g. 5500">
          </div>
          <div>
            <label>Image URL</label>
            <input type="text" id="fImage" placeholder="assets/images/products/product.jpg">
          </div>
          <div class="full">
            <label>Description</label>
            <textarea id="fDescription" placeholder="Product description…"></textarea>
          </div>
          <div class="full">
            <label>Sizes &amp; Stock</label>
            <div class="sizes-grid" id="sizesGrid">
              <div class="size-item"><span>XS</span><input type="number" class="size-input" data-size="XS" value="0" min="0"></div>
              <div class="size-item"><span>S</span><input type="number" class="size-input" data-size="S" value="0" min="0"></div>
              <div class="size-item"><span>M</span><input type="number" class="size-input" data-size="M" value="0" min="0"></div>
              <div class="size-item"><span>L</span><input type="number" class="size-input" data-size="L" value="0" min="0"></div>
              <div class="size-item"><span>XL</span><input type="number" class="size-input" data-size="XL" value="0" min="0"></div>
              <div class="size-item"><span>XXL</span><input type="number" class="size-input" data-size="XXL" value="0" min="0"></div>
            </div>
          </div>
          <div class="full" style="display:flex;gap:.6rem;align-items:center">
            <button type="submit" class="btn-primary" id="submitBtn"><i class="fas fa-save"></i> Save Product</button>
            <button type="button" class="btn-edit hidden" id="cancelBtn">Cancel</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Product List -->
    <div class="card-dash">
      <h2><i class="fas fa-box" style="color:#ec4899"></i> Products <span class="badge-dash" id="prodCount">0</span></h2>
      <div id="productList"><div class="empty-state">No products yet. Add your first one above.</div></div>
    </div>
  </div>
</div>
<div class="toast-admin" id="toastAdmin"></div>
<script>
const ADMIN_PW='kamene2024',STORAGE_KEY='kg_products';
let products=[],editingId=null;
const $=id=>document.getElementById(id);
const loginBox=$('loginBox'),dashboard=$('dashboard'),logoutBtn=$('logoutBtn'),passwordInput=$('passwordInput'),loginBtn=$('loginBtn'),loginError=$('loginError'),productForm=$('productForm'),formTitle=$('formTitle'),submitBtn=$('submitBtn'),cancelBtn=$('cancelBtn'),fName=$('fName'),fCategory=$('fCategory'),fPrice=$('fPrice'),fImage=$('fImage'),fDescription=$('fDescription'),productList=$('productList'),prodCount=$('prodCount'),toastAdmin=$('toastAdmin');
function toast(m){toastAdmin.textContent=m;toastAdmin.classList.add('show');clearTimeout(toastAdmin._t);toastAdmin._t=setTimeout(()=>toastAdmin.classList.remove('show'),2500)}
function loadProducts(){try{products=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{products=[]}}
function saveProducts(){localStorage.setItem(STORAGE_KEY,JSON.stringify(products))}
function renderProducts(){if(!productList)return;if(!products.length){productList.innerHTML='<div class="empty-state">No products yet. Add your first one above.</div>';prodCount.textContent='0';return}
prodCount.textContent=products.length;productList.innerHTML=products.map((p,i)=>{const sizes=p.sizes?Object.entries(p.sizes).filter(([,v])=>v>0).map(([s,v])=>s+':'+v).join(', '):'N/A'
return '<div class="prod-item"><img src="'+(p.image||'assets/images/logo.png')+'" alt="'+p.name+'" onerror="this.src=\'assets/images/logo.png\'"><div class="info"><strong>'+p.name+'</strong><span>'+p.category+' · KES '+(+p.price).toLocaleString()+' · Sizes: '+sizes+'</span></div><div class="actions"><button class="btn-edit" onclick="editProduct('+i+')"><i class="fas fa-pen"></i></button><button class="btn-danger" onclick="deleteProduct('+i+')"><i class="fas fa-trash"></i></button></div></div>'}).join('')}
function getSizes(){const s={};document.querySelectorAll('.size-input').forEach(inp=>{s[inp.dataset.size]=Math.max(0,parseInt(inp.value)||0)});return s}
function setSizes(s){document.querySelectorAll('.size-input').forEach(inp=>{inp.value=(s&&s[inp.dataset.size])||0})}
function resetForm(){productForm.reset();setSizes({});editingId=null;formTitle.textContent='Add Product';submitBtn.innerHTML='<i class="fas fa-save"></i> Save Product';cancelBtn.classList.add('hidden');document.querySelectorAll('.size-input').forEach(el=>el.value='0')}
function editProduct(i){const p=products[i];if(!p)return;editingId=i;fName.value=p.name||'';fCategory.value=p.category||'Apparel';fPrice.value=p.price||'';fImage.value=p.image||'';fDescription.value=p.description||'';setSizes(p.sizes||{});formTitle.textContent='Edit Product';submitBtn.innerHTML='<i class="fas fa-save"></i> Update Product';cancelBtn.classList.remove('hidden')}
function deleteProduct(i){if(!confirm('Delete this product?'))return;products.splice(i,1);saveProducts();renderProducts();toast('Product deleted')}
function handleSubmit(e){e.preventDefault();const n=fName.value.trim(),p=fPrice.value.trim();if(!n||!p){toast('Name and price are required');return}
const product={name:n,category:fCategory.value,price:p,image:fImage.value.trim()||'assets/images/logo.png',description:fDescription.value.trim(),sizes:getSizes()};if(editingId!==null)products[editingId]=product,toast('Product updated');else products.push(product),toast('Product added')
saveProducts();renderProducts();resetForm()}
function login(){if(passwordInput.value.trim()===ADMIN_PW){loginBox.classList.add('hidden');dashboard.classList.remove('hidden');logoutBtn.classList.remove('hidden');loginError.style.display='none';passwordInput.value='';loadProducts();renderProducts()}else{loginError.style.display='block';passwordInput.value='';passwordInput.focus()}}
function logout(){dashboard.classList.add('hidden');loginBox.classList.remove('hidden');logoutBtn.classList.add('hidden');passwordInput.value='';loginError.style.display='none'}
loginBtn.addEventListener('click',login);passwordInput.addEventListener('keydown',function(e){if(e.key==='Enter')login()});logoutBtn.addEventListener('click',logout);productForm.addEventListener('submit',handleSubmit);cancelBtn.addEventListener('click',resetForm);loadProducts();
</script>
</body>
</html>
